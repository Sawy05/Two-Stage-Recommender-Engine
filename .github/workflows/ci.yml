name: Two-Stage Recommender CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    name: Ruff, Black & PyTorch RecSys Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            torch numpy pydantic fastapi "uvicorn[standard]" pyyaml scikit-learn httpx \
            pytest ruff black

      - name: Code hygiene and linting (Ruff)
        run: ruff check src tests scripts

      - name: Formatting verification (Black)
        run: black --check src tests scripts

      - name: PyTorch Model Unit Tests (Shapes, Loss Convergence & TorchScript/ONNX Export)
        run: pytest tests/test_ranking_forward.py -v

      - name: Retrieval Recall@K & Ranking AUC / Latency Suite
        run: pytest tests/test_two_tower_retrieval.py tests/test_pipeline_latency.py -v

  docker-build:
    name: Docker Container Build Check
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: two-stage-recsys-dcn:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
