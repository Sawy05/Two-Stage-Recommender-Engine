version: "3.9"

services:
  recsys-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: two-stage-recsys-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EXPLORATION_TRAFFIC_SLICE=0.05
    depends_on:
      - qdrant
      - redis
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: two-stage-recsys-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: two-stage-recsys-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

volumes:
  qdrant_data:
