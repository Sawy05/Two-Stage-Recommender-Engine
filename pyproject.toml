[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "two-stage-recsys-dcn"
version = "1.0.0"
description = "Enterprise Two-Stage Recommendation System with Two-Tower Vector Retrieval, DCNv2 Ranking, and LinUCB Contextual Bandits"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Sawy05" }
]
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
    "pydantic>=2.4.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pyyaml>=6.0.1",
    "scikit-learn>=1.3.0",
    "httpx>=0.25.0",
    "qdrant-client>=1.7.0",
    "redis>=5.0.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.6",
    "black>=23.11.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
